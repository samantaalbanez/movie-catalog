name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties for CI
        run: echo "API_TOKEN=${{ secrets.API_TOKEN }}" > local.properties

      - name: Run Detekt Analysis
        run: |
         curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6.zip
         unzip -q detekt-cli-1.23.6.zip
         ./detekt-cli-1.23.6/bin/detekt-cli --build-upon-default-config

      - name: Run Android Lint & Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Check Proguard Build Release
        run: ./gradlew assembleRelease
