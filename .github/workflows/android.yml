name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties for CI
        run: echo "API_TOKEN=${{ secrets.API_TOKEN }}" > local.properties

      - name: Run Detekt on PR changes
        if: github.event_name == 'pull_request'
        run: |
            CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | grep '\.kt$' | paste -sd "," -)
            echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
    
          - name: Run Detekt
            if: github.event_name == 'pull_request' && env.CHANGED_FILES != ''
            uses: detekt/detekt-action@v1.23.6
            with:
              input: ${{ env.CHANGED_FILES }}
              plugins: 'io.nlopez.compose.rules:detekt:0.4.22'
              build-upon-default-config: true

      - name: Run Detekt on Full Project (Push)
        if: github.event_name == 'push'
        run: |
          curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6.zip
          unzip -q detekt-cli-1.23.6.zip
          ./detekt-cli-1.23.6/bin/detekt-cli --input app/src/main --build-upon-default-config

      - name: Run Android Lint & Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest
